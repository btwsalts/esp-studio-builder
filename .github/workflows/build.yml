name: PlatformIO Cloud Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "ESP board to compile"
        required: true
        type: choice
        options:
          - esp8266
          - esp32
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-esp8266:
    name: Build ESP8266
    if: ${{ github.event_name == 'push' || inputs.environment == 'esp8266' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile firmware
        run: pio run -e esp8266
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-studio-esp8266
          path: .pio/build/esp8266/firmware.bin
          if-no-files-found: error
          retention-days: 7

  build-esp32:
    name: Build ESP32
    if: ${{ github.event_name == 'push' || inputs.environment == 'esp32' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile firmware
        run: pio run -e esp32
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-studio-esp32
          path: .pio/build/esp32/firmware.bin
          if-no-files-found: error
          retention-days: 7
