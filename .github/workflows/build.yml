name: PlatformIO Cloud Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "ESP board to compile"
        required: true
        type: choice
        options:
          - esp8266
          - esp32
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.environment }}
    if: github.event_name != 'workflow_dispatch' || matrix.environment == inputs.environment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp8266, esp32]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-studio-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error
          retention-days: 7
